upstream task_api {
    server backend:5000 max_fails=1 fail_timeout=3s;
    server backend2:5000 max_fails=1 fail_timeout=3s;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name localhost app.local companion.local _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    root /usr/share/nginx/html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    return 404;
}

server {
    listen 443 ssl;
    server_name localhost app.local;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    limit_req_status 429;

    location /assets/ {
        alias /usr/share/nginx/html/;
    }

    location /api/ {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://task_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 1s;
    }

    location = /admin {
        auth_basic "Учебная панель";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        try_files /admin/index.html =404;
    }

    location ^~ /admin/ {
        auth_basic "Учебная панель";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        autoindex off;
    }

    location = /healthz {
        proxy_pass http://task_api/health;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html { internal; }
}

server {
    listen 443 ssl;
    server_name companion.local;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    root /usr/share/nginx/html/companion;
    index index.html;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    location = /404.html { internal; }
}

server {
    listen 8081;
    location = /healthz {
        proxy_pass http://task_api/health;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
