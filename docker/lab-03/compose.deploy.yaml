services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?temporary deployment password is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 2s
      retries: 25
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]

  backend:
    image: ${BACKEND_IMAGE:?published backend digest is required}
    environment:
      DATABASE_URL: postgresql://tasks:${POSTGRES_PASSWORD:?temporary deployment password is required}@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [frontend, database]

  frontend:
    image: ${FRONTEND_IMAGE:?published frontend digest is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [frontend]

networks:
  frontend: {}
  database:
    internal: true

volumes:
  postgres_data: {}
