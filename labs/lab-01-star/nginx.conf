server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    default_type text/plain;

    # Intentionally vulnerable: prefix location has no trailing slash.
    location /img {
        alias /usr/share/nginx/html/data/images/;
    }

    # Intentionally exposes backup filenames and contents.
    location /backup/ {
        alias /usr/share/nginx/html/backup/;
        autoindex on;
    }

    # No deny rule for dotfiles: the .env fixture is served as static content.
    location / {
        try_files $uri $uri/ =404;
    }
}
