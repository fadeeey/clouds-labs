name: cloud-labs

services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    cpus: 0.50
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: clouds-lab-backend:local
    build:
      context: .
      dockerfile: docker/lab-02/Dockerfile.good
    environment:
      DATABASE_URL: postgresql://tasks:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - frontend
      - database

  backend2:
    image: clouds-lab-backend:local
    build:
      context: .
      dockerfile: docker/lab-02/Dockerfile.good
    environment:
      DATABASE_URL: postgresql://tasks:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/tasks
      BACKEND_ID: backend-2
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - frontend
      - database

  frontend:
    image: clouds-lab-frontend:local
    build:
      context: .
      dockerfile: docker/lab-02/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./.local/nginx/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./.local/nginx/tls.key:/etc/nginx/certs/tls.key:ro
      - ./.local/nginx/.htpasswd:/etc/nginx/auth/.htpasswd:ro
    networks:
      - frontend

  resource-probe:
    image: clouds-lab-backend:local
    profiles: ["lab-02-probe"]
    restart: "no"
    network_mode: none
    cpus: 0.25
    mem_limit: 64m
    entrypoint: ["python"]
    command: ["-c", "import time; time.sleep(3600)"]
    healthcheck:
      disable: true

volumes:
  postgres_data:

networks:
  frontend:
  database:
    internal: true
