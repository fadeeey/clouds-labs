name: ЛР-03 · pipeline

on:
  push:
    branches:
      - main
      - work/lab-03
      - work/lab-03-negative-test
      - work/lab-03-negative-critical
  workflow_dispatch:
    inputs:
      critical_negative:
        description: "Проверить, что Critical finding блокирует публикацию и deploy"
        type: boolean
        required: false
        default: false

concurrency:
  group: lab-03-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint and integration tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: tasks
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
    env:
      DATABASE_URL: postgresql://tasks:ci-test-only@127.0.0.1:5432/tasks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned lint tool and application dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.1
      - name: Lint
        run: ruff check app tests
      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests -v

  build_scan_publish:
    name: Build, scan and publish by digest
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.push.outputs.backend_image }}
      frontend_image: ${{ steps.push.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build ARM64 candidate images
        env:
          BACKEND_LOCAL: clouds-lab-backend:${{ github.sha }}
          FRONTEND_LOCAL: clouds-lab-frontend:${{ github.sha }}
        run: |
          set -o pipefail
          docker buildx build --progress=plain --platform linux/arm64 --load -f docker/lab-02/Dockerfile.good -t "$BACKEND_LOCAL" . 2>&1 | tee "$RUNNER_TEMP/build-backend.log"
          docker buildx build --progress=plain --platform linux/arm64 --load -f docker/lab-03/Dockerfile.frontend -t "$FRONTEND_LOCAL" . 2>&1 | tee "$RUNNER_TEMP/build-frontend.log"
          docker buildx build --progress=plain --platform linux/arm64 --load -f docker/lab-02/Dockerfile.good -t "$BACKEND_LOCAL" . 2>&1 | tee "$RUNNER_TEMP/build-backend-cache.log"
          docker buildx build --progress=plain --platform linux/arm64 --load -f docker/lab-03/Dockerfile.frontend -t "$FRONTEND_LOCAL" . 2>&1 | tee "$RUNNER_TEMP/build-frontend-cache.log"
          grep -q 'CACHED' "$RUNNER_TEMP/build-backend-cache.log"
          grep -q 'CACHED' "$RUNNER_TEMP/build-frontend-cache.log"
          echo "BuildKit layer cache verified on repeated backend/frontend builds."
          docker image inspect "$BACKEND_LOCAL" "$FRONTEND_LOCAL" --format '{{.RepoTags}} {{.Id}} {{.Os}}/{{.Architecture}} {{.Size}}'
      - name: Scan backend and frontend with pinned Trivy
        env:
          BACKEND_LOCAL: clouds-lab-backend:${{ github.sha }}
          FRONTEND_LOCAL: clouds-lab-frontend:${{ github.sha }}
          SCANNER: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/scan"
          for item in "backend:$BACKEND_LOCAL" "frontend:$FRONTEND_LOCAL"; do
            name=${item%%:*}
            image=${item#*:}
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v "$RUNNER_TEMP/scan:/scan" "$SCANNER" image --scanners vuln --severity HIGH,CRITICAL --format json --output "/scan/$name.json" "$image"
          done
          python scripts/lab-03/summarize_scan.py "$RUNNER_TEMP/scan/backend.json" "$BACKEND_LOCAL" >> "$GITHUB_STEP_SUMMARY"
          python scripts/lab-03/summarize_scan.py "$RUNNER_TEMP/scan/frontend.json" "$FRONTEND_LOCAL" >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$SCANNER" image --scanners vuln --severity CRITICAL --exit-code 1 "$BACKEND_LOCAL"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$SCANNER" image --scanners vuln --severity CRITICAL --exit-code 1 "$FRONTEND_LOCAL"
      - name: Optional negative Critical-gate run
        if: ${{ inputs.critical_negative || github.ref == 'refs/heads/work/lab-03-negative-critical' }}
        env:
          SCANNER: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          docker buildx build --platform linux/arm64 --load -f docker/lab-02/Dockerfile.bad -t clouds-lab-backend:critical-negative .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$SCANNER" image --scanners vuln --severity CRITICAL --exit-code 1 clouds-lab-backend:critical-negative
      - name: Login to GHCR and publish scanned images
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_LOCAL: clouds-lab-backend:${{ github.sha }}
          FRONTEND_LOCAL: clouds-lab-frontend:${{ github.sha }}
          BACKEND_REF: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_REF: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
        run: |
          echo "::add-mask::$GH_TOKEN"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$BACKEND_LOCAL" "$BACKEND_REF"
          docker tag "$FRONTEND_LOCAL" "$FRONTEND_REF"
          docker push "$BACKEND_REF" 2>&1 | tee "$RUNNER_TEMP/push-backend.log"
          docker push "$FRONTEND_REF" 2>&1 | tee "$RUNNER_TEMP/push-frontend.log"
          BACKEND_DIGEST=$(python -c 'import re; print(re.findall(r"digest: (sha256:[0-9a-f]{64})", open(__import__("sys").argv[1]).read())[-1])' "$RUNNER_TEMP/push-backend.log")
          FRONTEND_DIGEST=$(python -c 'import re; print(re.findall(r"digest: (sha256:[0-9a-f]{64})", open(__import__("sys").argv[1]).read())[-1])' "$RUNNER_TEMP/push-frontend.log")
          test -n "$BACKEND_DIGEST" && test -n "$FRONTEND_DIGEST"
          echo "backend_image=ghcr.io/${GITHUB_REPOSITORY}/backend@$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${GITHUB_REPOSITORY}/frontend@$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Published image manifests"
            echo "- Backend: `ghcr.io/${GITHUB_REPOSITORY}/backend@$BACKEND_DIGEST`"
            echo "- Frontend: `ghcr.io/${GITHUB_REPOSITORY}/frontend@$FRONTEND_DIGEST`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
      - name: Remove registry credentials from the runner
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    name: Pull and verify published digests
    needs: build_scan_publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::add-mask::$GH_TOKEN"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Deploy published images in an isolated Compose project
        env:
          BACKEND_IMAGE: ${{ needs.build_scan_publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build_scan_publish.outputs.frontend_image }}
          DEPLOY_PROJECT: lab03-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/lab03-deploy.env"
          trap 'docker compose --project-name "$DEPLOY_PROJECT" --env-file "$env_file" -f docker/lab-03/compose.deploy.yaml down --volumes --remove-orphans >/dev/null 2>&1 || true; docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$env_file"' EXIT
          umask 077
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nPOSTGRES_PASSWORD=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$POSTGRES_PASSWORD" > "$env_file"
          docker compose --project-name "$DEPLOY_PROJECT" --env-file "$env_file" -f docker/lab-03/compose.deploy.yaml pull
          docker compose --project-name "$DEPLOY_PROJECT" --env-file "$env_file" -f docker/lab-03/compose.deploy.yaml up -d --no-build
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:18080/healthz; then
            docker compose --project-name "$DEPLOY_PROJECT" --env-file "$env_file" -f docker/lab-03/compose.deploy.yaml logs --no-color frontend
            exit 1
          fi
          marker="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(python -c 'import json,sys; print(json.dumps({"title":sys.argv[1]}))' "$marker")
          created=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:18080/api/tasks)
          listed=$(curl --fail --silent --show-error http://127.0.0.1:18080/api/tasks)
          python -c 'import json,sys; marker=sys.argv[1]; created=json.loads(sys.argv[2]); listed=json.loads(sys.argv[3]); assert created["title"] == marker; assert any(row["id"] == created["id"] and row["title"] == marker for row in listed); print("health + POST + GET verified for", marker)' "$marker" "$created" "$listed"
          {
            echo "## Ephemeral deployment check"
            echo "Compose pulled the exact registry digests above with `--no-build`. The health endpoint and task POST/GET round trip passed. The job then removes its isolated project and disposable volume."
          } >> "$GITHUB_STEP_SUMMARY"
